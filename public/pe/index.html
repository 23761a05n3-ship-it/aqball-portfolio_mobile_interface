<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5b6573;--bd:#d9dde3;--ac:#1f4e78;--cb:#0f172a;--ct:#e2e8f0;--bar:#1e293b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1319;--card:#171c24;--tx:#e6e9ee;--mu:#9aa5b4;--bd:#2a313c;--ac:#6fb1e8;--cb:#0a0e14;--bar:#1e293b}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
h1{font-size:17px;margin:0 0 8px;color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tab{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input{padding:6px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:200px;font-size:13px}
main{max-width:900px;margin:0 auto;padding:14px}
#who{margin:6px 0 0;font-size:13px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:12px 0}
h2{font-size:18px;margin:6px 0 4px}h3{font-size:14px;margin:0 0 6px;color:var(--ac)}
.q{margin:0 0 8px;color:var(--mu);font-size:13.5px}
.cb{border-radius:8px;overflow:hidden;margin:8px 0;background:var(--cb)}
.cbh{display:flex;justify-content:space-between;align-items:center;background:var(--bar);padding:5px 10px;color:#94a3b8;font-size:12px}
.cp{background:#334155;color:#e2e8f0;border:0;border-radius:5px;padding:4px 10px;cursor:pointer;font-size:12px}
.cp:hover{background:#475569}.cp.ok{background:#15803d}
pre{margin:0;padding:10px 12px;overflow-x:auto;color:var(--ct);font:12.5px/1.5 ui-monospace,Consolas,monospace;tab-size:4}
.note{font-size:13px;color:var(--mu);font-style:italic}
</style></head><body>

<script>
const D={"setup": "!pip -q install transformers accelerate torch\nfrom transformers import pipeline\npipe = pipeline(\"text-generation\", model=\"HuggingFaceTB/SmolLM2-360M-Instruct\")\ndef ask_llm(prompt, max_tokens=200):\n    messages = [{\"role\": \"user\", \"content\": prompt}]\n    out = pipe(messages, max_new_tokens=max_tokens, do_sample=False)\n    return out[0][\"generated_text\"][-1][\"content\"]", "sets": {"1": {"title": "Introduction and Baseline vs Enhanced Prompts", "items": [{"label": "Question 1", "text": "Write a Python program to load HuggingFaceTB/SmolLM2-360M-Instruct using the Hugging Face pipeline and generate a response to \"Describe LBRCE.\" with max_new_tokens=100. Show the output.", "code": ["!pip install -q transformers accelerate torch\nfrom transformers import pipeline\n\npipe = pipeline(\n    \"text-generation\",\n    model=\"HuggingFaceTB/SmolLM2-360M-Instruct\"\n)\n\nmessages = [\n    {\"role\": \"user\", \"content\": \"Describe LBRCE.\"}\n]\n\noutputs = pipe(messages, max_new_tokens=100, do_sample=False)\nprint(outputs[0][\"generated_text\"][-1][\"content\"])"]}, {"label": "Question 2", "text": "Define the function ask_llm(prompt, max_tokens=200) and run a baseline prompt asking for a one-paragraph bio of Ada Lovelace. Show the output.", "code": ["def ask_llm(prompt, max_tokens=200):\n    messages = [{\"role\": \"user\", \"content\": prompt}]\n    outputs = pipe(messages, max_new_tokens=max_tokens, do_sample=False)\n    return outputs[0][\"generated_text\"][-1][\"content\"]\n\nbaseline_prompt = \"\"\"\nWrite a one-paragraph bio of Ada Lovelace.\n\"\"\"\nbaseline_output = ask_llm(baseline_prompt)\nprint(\"Baseline Prompt\")\nprint(\"-\" * 50)\nprint(baseline_output)"]}, {"label": "Question 3", "text": "Write and run an enhanced prompt for the same task (role framing, audience of first-year engineering students, mention of Charles Babbage, simple English, about 120 words). Fill an observation table comparing baseline and enhanced outputs.", "code": ["enhanced_prompt = \"\"\"\nYou are a computer science historian.\nWrite a one-paragraph biography of Ada Lovelace.\nRequirements:\n1. Write for first-year engineering students.\n2. Mention her collaboration with Charles Babbage.\n3. Explain why she is considered the world's first computer programmer.\n4. Use simple English.\n5. Limit the response to about 120 words.\n\"\"\"\nenhanced_output = ask_llm(enhanced_prompt)\nprint(\"Enhanced Prompt\")\nprint(\"-\" * 50)\nprint(enhanced_output)"]}]}, "2": {"title": "Iterative Refinement and Constraint Specification", "items": [{"label": "Question 1", "text": "Using ask_llm(), summarize the plot of Romeo and Juliet in two sentences through three rounds of prompt tweaking (Round 1 basic, Round 2 with feud and tragic ending in simple English, Round 3 with teacher role and under 50 words). Show all three outputs.", "code": ["# Round 1 - basic prompt\nprompt1 = \"\"\"\nSummarize the plot of the Shakespearean play Romeo and Juliet in two sentences.\n\"\"\"\nprint(\"ROUND 1\")\nprint(\"-\" * 60)\nprint(ask_llm(prompt1))\n\n# Round 2 - feud + tragic ending + simple English\nprompt2 = \"\"\"\nSummarize the plot of Romeo and Juliet in exactly two sentences.\nInclude:\n- the conflict between the two families\n- the tragic ending\nUse simple English.\n\"\"\"\nprint(\"ROUND 2\")\nprint(\"-\" * 60)\nprint(ask_llm(prompt2))\n\n# Round 3 - teacher role + more requirements + under 50 words\nprompt3 = \"\"\"\nYou are an English literature teacher.\nSummarize the plot of Shakespeare's Romeo and Juliet in exactly two sentences.\nRequirements:\n1. Mention the feud between the Montague and Capulet families.\n2. Mention the secret marriage.\n3. Mention the tragic ending.\n4. Use simple language suitable for first-year engineering students.\n5. Keep the summary engaging and under 50 words.\n\"\"\"\nprint(\"ROUND 3\")\nprint(\"-\" * 60)\nprint(ask_llm(prompt3))"]}, {"label": "Question 2", "text": "Prepare the observation table for the three rounds (follows instruction, family feud, secret marriage, tragic ending, audience-specific, clarity, word limit).", "code": [], "note": "No code: write the observation / comparison table in your record."}, {"label": "Question 3", "text": "Run Cycle 1 (basic prompt) and Cycle 2 (100-120 words, one paragraph, three benefits, two challenges) to summarize a short passage on AI in Healthcare. Identify the failures in Cycle 1 and the improvements in Cycle 2.", "code": ["article = \"\"\"\nArtificial Intelligence (AI) is being used in healthcare to analyse medical\nimages, predict health risks and suggest treatments. It helps doctors diagnose\ndiseases faster, supports personalized treatment plans, and automates\nadministrative work such as appointment scheduling and record keeping. AI also\nspeeds up medical research by studying large amounts of health data. However,\nthere are concerns about patient privacy, bias in algorithms and ethical use\nof AI in medical decisions.\n\"\"\"\n\n# Cycle 1 - basic prompt\ncycle1 = f\"\"\"\nSummarize the following article about AI in healthcare.\n{article}\n\"\"\"\nprint(\"CYCLE 1\")\nprint(\"-\" * 60)\nprint(ask_llm(cycle1, 200))\n\n# Cycle 2 - added constraints\ncycle2 = f\"\"\"\nSummarize the article in 100-120 words. Include:\n- A brief introduction.\n- Three key benefits of AI in healthcare.\n- Two major challenges.\nWrite in one paragraph using simple language.\n{article}\n\"\"\"\nprint(\"CYCLE 2\")\nprint(\"-\" * 60)\nprint(ask_llm(cycle2, 250))"]}]}, "3": {"title": "Diagnosing Prompt Failures and Edge Cases", "items": [{"label": "Question 1", "text": "Execute the vague prompts \"Explain Python.\" and \"Explain the algorithm.\" Identify the failure mode of each (Case 1 and Case 2).", "code": ["prompt1 = \"\"\"\nExplain Python.\n\"\"\"\nprint(ask_llm(prompt1))\n\nprompt3 = \"\"\"\nExplain the algorithm.\n\"\"\"\nprint(ask_llm(prompt3))"]}, {"label": "Question 2", "text": "Write and run the refined prompts for both cases (Python programming language with definition, key features, one application in 100 words; Binary Search with working principle, time complexity and one example).", "code": ["prompt2 = \"\"\"\nExplain the Python programming language.\nInclude:\n- definition\n- key features\n- one real-world application\nLimit your answer to 100 words.\n\"\"\"\nprint(ask_llm(prompt2))\n\nprompt4 = \"\"\"\nExplain the Binary Search algorithm.\nInclude:\n- working principle\n- time complexity\n- one example\n\"\"\"\nprint(ask_llm(prompt4))"]}, {"label": "Question 3", "text": "Write and run the prompts for Case 3 (Contradictory Instructions) and Case 4 (Format Error) with their refined versions. Prepare the observation table for all four cases.", "code": ["# Case 3 - Contradictory Instructions (original)\nprompt5 = \"\"\"\nWrite exactly 40 words.\nUse only bullet points.\nWrite one paragraph.\n\"\"\"\nprint(ask_llm(prompt5))\n\n# Case 3 - refined\nprompt6 = \"\"\"\nWrite exactly 40 words about Artificial Intelligence.\nPresent the answer using four bullet points.\n\"\"\"\nprint(ask_llm(prompt6))\n\n# Case 4 - Format Error (original)\nprompt7 = \"\"\"\nCreate a table without rows or columns.\n\"\"\"\nprint(ask_llm(prompt7))\n\n# Case 4 - refined\nprompt8 = \"\"\"\nCreate a markdown table comparing Artificial Intelligence and Machine Learning.\nInclude:\n- Definition\n- Goal\n- Example\n\"\"\"\nprint(ask_llm(prompt8))"]}]}, "4": {"title": "Zero-Shot vs Few-Shot Prompting", "items": [{"label": "Question 1", "text": "Zero-shot prompt: classify the movie sentence. Output only the label.", "code": ["zero_prompt = \"\"\"\nClassify the sentiment of the following sentence as Positive, Negative, or Neutral.\nSentence: \"The movie had excellent visuals, but the story was boring.\"\nOutput only the sentiment label.\n\"\"\"\nprint(ask_llm(zero_prompt, 10))"]}, {"label": "Question 2", "text": "Few-shot prompt with three examples (Positive, Negative, Neutral).", "code": ["examples = \"\"\"Classify each sentence as Positive, Negative, or Neutral.\nInput: \"The product is excellent and works perfectly.\"\nOutput: Positive\nInput: \"The service was terrible and very disappointing.\"\nOutput: Negative\nInput: \"The package arrived on Tuesday.\"\nOutput: Neutral\n\"\"\"\nfew_prompt = examples + \"\"\"Now classify the following sentence:\nInput: \"The movie had excellent visuals, but the story was boring.\"\nOutput:\"\"\"\nprint(ask_llm(few_prompt, 10))"]}, {"label": "Question 3", "text": "Test both prompts on the 5 sentences and compare.", "code": ["sentences = [\n    \"The phone has an amazing camera and excellent battery life.\",\n    \"The food was cold and tasted terrible.\",\n    \"The meeting is scheduled for 10 AM tomorrow.\",\n    \"The hotel room was beautiful, but the service was disappointing.\",\n    \"The product is acceptable, although nothing special.\",\n]\nexpected = [\"Positive\", \"Negative\", \"Neutral\", \"Negative\", \"Neutral\"]\n\ndef zero_shot(s):\n    return ask_llm(f'Classify the sentiment as Positive, Negative, or Neutral.\\n'\n                   f'Sentence: \"{s}\"\\nOutput only the sentiment label.', 10).strip()\n\ndef few_shot(s):\n    return ask_llm(examples + f'Now classify the following sentence:\\nInput: \"{s}\"\\nOutput:', 10).strip()\n\nz_ok = f_ok = 0\nprint(\"Expected | Zero-Shot | Few-Shot\")\nfor s, e in zip(sentences, expected):\n    z, f = zero_shot(s), few_shot(s)\n    z_ok += (z == e); f_ok += (f == e)\n    print(e, \"|\", z, \"|\", f)\nprint(\"Zero-Shot accuracy:\", z_ok / 5 * 100, \"%\")\nprint(\"Few-Shot accuracy :\", f_ok / 5 * 100, \"%\")"]}]}, "5": {"title": "Role-Based and Negative Prompting", "items": [{"label": "Question 1", "text": "Write and run a role-based prompt in which the model is an experienced cybersecurity teacher explaining how to create a strong password to beginners.", "code": ["role_prompt = \"\"\"\nYou are an experienced cybersecurity teacher who explains technical concepts\nto beginners using simple language and real-life examples.\nExplain how to create a strong password.\n\"\"\"\nprint(ask_llm(role_prompt))"]}, {"label": "Question 2", "text": "Write and run a negative prompt for the same task (no brand names, no jargon, no personal information, under 100 words).", "code": ["negative_prompt = \"\"\"\nExplain how to create a strong password for a beginner.\nDo not mention any brand names.\nDo not use technical jargon.\nDo not provide examples containing personal information.\nKeep the response under 100 words.\n\"\"\"\nprint(ask_llm(negative_prompt))"]}, {"label": "Question 3", "text": "Compare the two outputs in a table (main purpose, effect on tone, effect on content, best use) and write a conclusion on how each technique influences the response.", "code": [], "note": "No code: write the observation / comparison table in your record."}]}, "6": {"title": "Structured Format Prompting", "items": [{"label": "Question 1", "text": "Write and run a prompt to list five benefits of daily exercise as a bullet list, each with a one-sentence explanation.", "code": ["bullet_prompt = \"\"\"\nList five benefits of daily exercise.\nPresent the answer as a bullet list.\nEach bullet should contain one benefit and a one-sentence explanation.\n\"\"\"\nprint(ask_llm(bullet_prompt))"]}, {"label": "Question 2", "text": "Write and run a prompt to create a Markdown table about three programming languages with exactly three rows and the columns Language and Main Use, with no text outside the table.", "code": ["lang_prompt = \"\"\"\nCreate a Markdown table about three programming languages.\nUse exactly three rows and two columns: Language and Main Use.\nDo not include any additional explanation outside the table.\n\"\"\"\nprint(ask_llm(lang_prompt))"]}, {"label": "Question 3", "text": "Write and run a prompt for a Markdown table of five applications of AI with the columns Application, Example and Benefit (each cell below 20 words, no text before or after). Verify the output with a checklist.", "code": ["ai_prompt = \"\"\"\nExplain five applications of Artificial Intelligence.\nPresent the information as a Markdown table with exactly three columns:\nApplication, Example, and Benefit.\nInclude exactly five rows. Keep each cell below 20 words.\nDo not provide any text before or after the table.\n\"\"\"\nanswer = ask_llm(ai_prompt, 300)\nprint(answer)\n\n# Verification\nlines = answer.strip().split(\"\\n\")\nrows = [l for l in lines if l.startswith(\"|\")]\ndata_rows = rows[2:]\ncols = [c.strip() for c in rows[0].strip(\"|\").split(\"|\")]\nprint(\"Only a table (no extra text):\", len(rows) == len(lines))\nprint(\"Columns correct :\", cols == [\"Application\", \"Example\", \"Benefit\"])\nprint(\"Exactly 5 rows  :\", len(data_rows) == 5)\nprint(\"Each cell below 20 words :\",\n      all(len(c.split()) < 20 for r in data_rows for c in r.strip(\"|\").split(\"|\")))"]}]}, "7": {"title": "JSON / YAML Generation and Validation", "items": [{"label": "Question 1", "text": "Generate a dataset of three books (title, author, publication_year) as valid JSON only.", "code": ["json_prompt = \"\"\"\nGenerate a valid JSON dataset containing three books.\nEach book must include the fields title (string), author (string)\nand publication_year (integer).\nReturn only valid JSON with no additional text.\n\"\"\"\njson_data = ask_llm(json_prompt, 300)\nprint(json_data)"]}, {"label": "Question 2", "text": "Validate the JSON with json.loads() and handle JSONDecodeError.", "code": ["import json\ntry:\n    parsed = json.loads(json_data)\n    print(\"Valid JSON\")\n    print(parsed)\nexcept json.JSONDecodeError as e:\n    print(\"Invalid JSON:\", e)"]}, {"label": "Question 3", "text": "Generate the equivalent YAML, validate with yaml.safe_load() and write the refined prompt.", "code": ["!pip -q install pyyaml\nimport yaml\n\nyaml_prompt = \"\"\"\nConvert this data into valid YAML. Return only YAML with no explanation.\n\"\"\" + json_data\nyaml_data = ask_llm(yaml_prompt, 300)\nprint(yaml_data)\n\ntry:\n    parsed = yaml.safe_load(yaml_data)\n    print(\"Valid YAML\")\nexcept yaml.YAMLError as e:\n    print(\"Invalid YAML:\", e)\n\n# Refined prompt to use when parsing fails\nrefined_prompt = \"\"\"\nGenerate only valid JSON (or YAML). Do not include explanations,\nmarkdown formatting, or comments. Ensure all brackets, commas, indentation\nand quotation marks follow the JSON (or YAML) specification.\nReturn a single valid object containing a books array with exactly three\nbook records.\n\"\"\"\nprint(ask_llm(refined_prompt, 300))"]}]}, "8": {"title": "Chain-of-Thought and Task Decomposition", "items": [{"label": "Question 1", "text": "Direct-answer prompt for the A, B, C marks problem.", "code": ["direct_prompt = \"\"\"\nSolve the following problem and give only the final answer:\nA, B, and C scored different marks. A scored more than B, C scored less than A,\nB scored more than C. A scored 90 and B scored 10 less than A.\nWhat are their marks?\n\"\"\"\nprint(ask_llm(direct_prompt))"]}, {"label": "Question 2", "text": "Zero-shot Chain-of-Thought prompt (step by step, check each condition).", "code": ["cot_prompt = \"\"\"\nSolve the following problem step by step. Check each condition carefully\nbefore giving the final answer.\nA, B, and C scored different marks. A scored more than B, C scored less than A,\nB scored more than C. A scored 90 and B scored 10 less than A.\nWhat are their marks?\n\"\"\"\nprint(ask_llm(cot_prompt))"]}, {"label": "Question 3", "text": "Task decomposition with sequential sub-questions and a comparison of the three methods.", "code": ["step1 = ask_llm(\"A scored 90 marks. What is A's score? Give only the number.\", 10)\nstep2 = ask_llm(\"B scored 10 marks less than A, and A scored 90. \"\n                \"What is B's score? Give only the number.\", 10)\nstep3 = ask_llm(\"B scored more than C, and B scored 80. \"\n                \"What can we say about C's score?\", 40)\nprint(\"Step 1 - A's score :\", step1)\nprint(\"Step 2 - B's score :\", step2)\nprint(\"Step 3 - About C   :\", step3)\nprint(\"Final Answer: A = 90, B = 80, C < 80 (exact marks of C cannot be found)\")\n\nprint(\"\\n| Method | Approach | Expected Accuracy | Main Advantage |\")\nprint(\"|---|---|---|---|\")\nprint(\"| Direct Answer | Solve in one step | Medium | Simple and fast |\")\nprint(\"| Zero-Shot CoT | Step-by-step solution | High | Checks many conditions |\")\nprint(\"| Task Decomposition | Sequential sub-questions | High | Each step can be verified |\")"]}]}, "9": {"title": "Building a Simple LCEL Chain with SmolLM2-360M", "items": [{"label": "Install", "text": "Run once at the start of this set", "code": ["pip install langchain langchain-core transformers torch"]}, {"label": "Question 1", "text": "Write a program to load SmolLM2-360M with the Hugging Face pipeline and create a PromptTemplate that summarizes a text in 2-3 sentences.", "code": ["from langchain_core.prompts import PromptTemplate\nfrom transformers import pipeline\n\n# 1. Load SmolLM2-360M\ngenerator = pipeline(\n    \"text-generation\",\n    model=\"HuggingFaceTB/SmolLM2-360M\",\n    max_new_tokens=100,\n    temperature=0.2,\n    do_sample=True,\n    return_full_text=False      # return only the new text, not the prompt\n)\n\n# 2. Create a prompt template\nprompt = PromptTemplate.from_template(\n    \"Summarize the following text in 2-3 sentences:\\n\\n{text}\\n\\nSummary:\"\n)"]}, {"label": "Question 2", "text": "Wrap the model in a RunnableLambda and build the LCEL chain using the pipe operator with StrOutputParser.", "code": ["from langchain_core.runnables import RunnableLambda\nfrom langchain_core.output_parsers import StrOutputParser\n\n# 3. Create an LLM runnable for LCEL\ndef generate_text(prompt_text):\n    prompt_text = prompt_text.to_string()      # PromptValue -> plain string\n    result = generator(prompt_text)\n    return result[0][\"generated_text\"]\n\nllm = RunnableLambda(generate_text)\n\n# 4. Create the LCEL chain\nchain = prompt | llm | StrOutputParser()"]}, {"label": "Question 3", "text": "Run the chain with chain.invoke() on a fixed text about AI in education and print the summary. Explain the purpose of each component of the chain in a table.", "code": ["# 5. Fixed input text\ntext = \"\"\"\nArtificial Intelligence is transforming education by providing personalized\nlearning, automated feedback, intelligent tutoring, and improved access to\neducational resources. It can help teachers save time and enable students to\nlearn at their own pace.\n\"\"\"\n\n# 6. Execute the chain\nresult = chain.invoke({\"text\": text})\n\n# 7. Print the result\nprint(\"Summary:\")\nprint(result)"]}]}, "10": {"title": "Basic Data Indexing for RAG", "items": [{"label": "Install", "text": "Run once at the start of this set", "code": ["pip install langchain langchain-community langchain-huggingface sentence-transformers"]}, {"label": "Question 1", "text": "Create three Document objects (RAG, embeddings, vector store) with source metadata and split them using RecursiveCharacterTextSplitter (chunk_size=800, chunk_overlap=0). Print the number of documents and chunks.", "code": ["from langchain_core.documents import Document\nfrom langchain_text_splitters import RecursiveCharacterTextSplitter\n\ndocuments = [\n    Document(\n        page_content=\"\"\"Retrieval-Augmented Generation (RAG) combines information retrieval with a language model.\nRelevant documents are retrieved from a knowledge base and supplied to the model as context\nbefore generating an answer.\"\"\",\n        metadata={\"source\": \"rag_intro.txt\"}\n    ),\n    Document(\n        page_content=\"\"\"Embeddings represent text as numerical vectors. Texts with similar meanings generally have\nvectors that are close to each other in the embedding space. Embeddings are commonly used for\nsemantic search and document retrieval.\"\"\",\n        metadata={\"source\": \"embeddings.txt\"}\n    ),\n    Document(\n        page_content=\"\"\"A vector store indexes embeddings so that relevant chunks can be retrieved efficiently.\nDuring a RAG query, the query is embedded and compared with stored document embeddings.\"\"\",\n        metadata={\"source\": \"vector_store.txt\"}\n    ),\n]\n\n# about 200 tokens (800 characters used as a simple approximation)\ntext_splitter = RecursiveCharacterTextSplitter(chunk_size=800, chunk_overlap=0)\nchunks = text_splitter.split_documents(documents)\n\nprint(f\"Original documents : {len(documents)}\")\nprint(f\"Generated chunks   : {len(chunks)}\")"]}, {"label": "Question 2", "text": "Generate embeddings using HuggingFaceEmbeddings (sentence-transformers/all-MiniLM-L6-v2) and store the chunks in an InMemoryVectorStore.", "code": ["from langchain_huggingface import HuggingFaceEmbeddings\nfrom langchain_core.vectorstores import InMemoryVectorStore\n\nembeddings = HuggingFaceEmbeddings(\n    model_name=\"sentence-transformers/all-MiniLM-L6-v2\"\n)\n\nvector_store = InMemoryVectorStore(embeddings)\nvector_store.add_documents(chunks)\n\nprint(f\"Indexed chunks : {len(chunks)}\")"]}, {"label": "Question 3", "text": "Inspect each chunk (source, characters, embedding dimensions, text) and run a consistency check that all embeddings have the same dimensionality (384) and no chunk is empty.", "code": ["print(\"--- Chunk Inspection ---\")\nfor i, chunk in enumerate(chunks):\n    vector = embeddings.embed_query(chunk.page_content)\n    print(f\"\\nChunk {i + 1}\")\n    print(f\"Source: {chunk.metadata['source']}\")\n    print(f\"Characters: {len(chunk.page_content)}\")\n    print(f\"Embedding dimensions: {len(vector)}\")\n    print(f\"Text: {chunk.page_content.strip()}\")\n\n# Consistency check\nvectors = [embeddings.embed_query(c.page_content) for c in chunks]\ndimensions = {len(v) for v in vectors}\n\nprint(\"\\n--- Consistency Check ---\")\nprint(f\"Number of chunks: {len(chunks)}\")\nprint(f\"Embedding dimensions found: {dimensions}\")\n\nif len(dimensions) == 1 and 384 in dimensions:\n    print(\"OK: All embeddings have the same dimensionality (384).\")\nelse:\n    print(\"ERROR: Inconsistent embedding dimensions.\")\n\nif all(len(c.page_content.strip()) > 0 for c in chunks):\n    print(\"OK: All chunks contain text.\")\nelse:\n    print(\"ERROR: Empty chunk detected.\")\n\nprint(\"OK: Indexing completed.\")"]}]}, "11": {"title": "RAG with college.txt (Retriever and RAG Prompt)", "items": [{"label": "Question 1", "text": "Load college.txt, split (200/20), create local embeddings and a vector store.", "code": ["!pip -q install langchain langchain-community langchain-huggingface langchain-text-splitters sentence-transformers\n\n# create a small college.txt\nopen(\"college.txt\", \"w\").write(\"\"\"LBRCE Library Rules.\nA student can borrow up to three books at a time from the library.\nBooks must be returned within 14 days.\nThe library is open from 9 AM to 5 PM on working days.\nA fine of Rs. 2 per day is charged for late returns.\n\"\"\")\n\nfrom langchain_community.document_loaders import TextLoader\nfrom langchain_text_splitters import RecursiveCharacterTextSplitter\nfrom langchain_huggingface import HuggingFaceEmbeddings\nfrom langchain_core.vectorstores import InMemoryVectorStore\n\ndocuments = TextLoader(\"college.txt\").load()\nsplitter = RecursiveCharacterTextSplitter(chunk_size=200, chunk_overlap=20)\nchunks = splitter.split_documents(documents)\nprint(\"Chunks:\", len(chunks))\n\nembeddings = HuggingFaceEmbeddings(model_name=\"sentence-transformers/all-MiniLM-L6-v2\")\nvector_store = InMemoryVectorStore(embeddings)\nvector_store.add_documents(chunks)"]}, {"label": "Question 2", "text": "Create a retriever with k=2 and retrieve chunks for the question.", "code": ["retriever = vector_store.as_retriever(search_kwargs={\"k\": 2})\nquestion = \"How many books can a student borrow?\"\nretrieved_docs = retriever.invoke(question)\ncontext = \"\\n\\n\".join(d.page_content for d in retrieved_docs)\nprint(\"Retrieved Context:\")\nprint(context)"]}, {"label": "Question 3", "text": "Build the RAG prompt, get the answer from the LLM and compare with a normal prompt.", "code": ["# uses ask_llm() from the common setup (SmolLM2-360M-Instruct)\nrag_prompt = f\"\"\"\nAnswer the question using only the following context.\nContext:\n{context}\nQuestion:\n{question}\nIf the answer is not present in the context, say: \"I don't know based on the provided documents.\"\n\"\"\"\nprint(\"RAG answer   :\", ask_llm(rag_prompt, 60))\n\nnormal_prompt = f\"Answer this question:\\n{question}\"\nprint(\"Normal answer:\", ask_llm(normal_prompt, 60))"]}]}, "12": {"title": "Agent with Calculator Tool and Multimodal Prompting", "items": [{"label": "Question 1", "text": "Write safe_calculate() using ast (allow + - * / **, max 200 chars, exponent up to 10) and test 125 * 48.", "code": ["import ast, operator\n\nOPS = {ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul,\n       ast.Div: operator.truediv, ast.Pow: operator.pow,\n       ast.USub: operator.neg, ast.UAdd: operator.pos}\n\ndef safe_calculate(expression):\n    if len(expression) > 200:\n        raise ValueError(\"Expression too long\")\n    tree = ast.parse(expression, mode=\"eval\")\n\n    def evaluate(node):\n        if isinstance(node, ast.Constant) and type(node.value) in (int, float):\n            return node.value\n        if isinstance(node, ast.BinOp) and type(node.op) in OPS:\n            left, right = evaluate(node.left), evaluate(node.right)\n            if isinstance(node.op, ast.Pow) and abs(right) > 10:\n                raise ValueError(\"Exponent too large\")\n            return OPS[type(node.op)](left, right)\n        if isinstance(node, ast.UnaryOp) and type(node.op) in OPS:\n            return OPS[type(node.op)](evaluate(node.operand))\n        raise ValueError(\"Unsupported expression\")\n\n    return evaluate(tree.body)\n\nprint(safe_calculate(\"125 * 48\"))    # 6000"]}, {"label": "Question 2", "text": "Write run_agent(): model returns a JSON action, Python runs the calculator, result goes back to the model.", "code": ["import json, re\n\ndef run_agent(question):\n    decision_prompt = f\"\"\"\nUser question: {question}\nIf arithmetic is required, return ONLY a JSON object:\n{{\"action\":\"calculator\",\"expression\":\"125 * 48\"}}\nIf no calculation is needed, return ONLY:\n{{\"action\":\"final\",\"answer\":\"your answer\"}}\nUse only +, -, *, /, ** and parentheses in expressions. No text outside the JSON.\n\"\"\"\n    decision = ask_llm(decision_prompt, 80)\n    print(\"Model decision:\", decision)\n\n    match = re.search(r\"\\{.*\\}\", decision, re.DOTALL)\n    if not match:\n        return \"Invalid tool instructions.\"\n    try:\n        action = json.loads(match.group())\n    except json.JSONDecodeError:\n        return \"Could not parse tool instructions.\"\n\n    if action.get(\"action\") == \"calculator\":\n        expression = action.get(\"expression\", \"\")\n        try:\n            result = str(safe_calculate(expression))\n        except Exception as exc:\n            return f\"Calculator error: {exc}\"\n        print(\"Tool result:\", result)\n        final_prompt = f\"\"\"\nUser question: {question}\nCalculator expression: {expression}\nActual calculator result: {result}\nAnswer using the calculator result. Do not change it. Give a concise, direct answer.\n\"\"\"\n        return ask_llm(final_prompt, 60)\n    if action.get(\"action\") == \"final\":\n        return str(action.get(\"answer\", \"No answer provided.\"))\n    return \"Unknown action returned by model.\"\n\nprint(\"Final answer:\", run_agent(\"What is 125 multiplied by 48?\"))"]}, {"label": "Question 3", "text": "Multimodal prompting: text-to-image prompt, image-understanding prompt and alignment score.", "code": ["image_prompt = (\"A cozy mountain cabin at sunset, with warm lights glowing inside, \"\n                \"beside a calm, reflective lake. Snow-capped peaks are in the background, \"\n                \"evergreen trees surround the cabin, and a wooden dock with a small red \"\n                \"canoe is in the foreground. The sky has vibrant orange and pink colors, \"\n                \"and the scene feels peaceful and cinematic.\")\n\nunderstanding_prompt = (\"Describe this image in detail, including the main subjects, setting, \"\n                        \"colors, lighting, foreground objects, background, and overall mood. \"\n                        \"Do not infer details that are not visible.\")\n\n# 5 Match (2), 1 Partial (1), 1 Miss (0) out of 7 details\npoints = 5 * 2 + 1 * 1 + 1 * 0\nmax_points = 2 * 7\nscore = points / max_points * 100\nprint(f\"Points: {points}/{max_points}\")\nprint(f\"Alignment score: {score:.2f}%\")    # 78.57%"]}]}}, "students": {"23761A05J9": {"n": "ANDE TEJA NAGA RUPA", "s": [4, 8, 12]}, "23761A05K0": {"n": "AYINAKOTA MAHESH", "s": [9, 10, 11]}, "23761A05K1": {"n": "BADISA VINODINI", "s": [4, 7, 10]}, "23761A05K2": {"n": "BANDI RISHMITHA", "s": [8, 9, 12]}, "23761A05K3": {"n": "BHAVANA UDAY SIVA SHANKAR", "s": [7, 9, 11]}, "23761A05K4": {"n": "BHIMIREDDI SRI RESHMITHA", "s": [8, 10, 12]}, "23761A05K5": {"n": "BITRA GRISHMA", "s": [5, 6, 11]}, "23761A05K6": {"n": "BOLLA RATHNA BHARGAVI", "s": [3, 4, 11]}, "23761A05K7": {"n": "CHEDALAVADA HANURAM PHANI PRASAD", "s": [5, 7, 8]}, "23761A05K8": {"n": "DUDALA VENKATA LOKESH", "s": [6, 10, 12]}, "23761A05K9": {"n": "GODAVARTHI SHRESTHA CHARITHA", "s": [1, 7, 12]}, "23761A05L0": {"n": "GUDISE LAHARI", "s": [4, 6, 9]}, "23761A05L1": {"n": "GUGULOTHU SRAVANTHI", "s": [2, 5, 8]}, "23761A05L2": {"n": "JANGALA GNANAPRIYA", "s": [4, 7, 10]}, "23761A05L3": {"n": "JARAPALA ROJA", "s": [3, 5, 11]}, "23761A05L4": {"n": "JONNALAGADDA VINAY KUMAR", "s": [1, 3, 9]}, "23761A05L5": {"n": "KALVAKUNTLA VIJAY KANTH", "s": [4, 8, 9]}, "23761A05L6": {"n": "KANALA JAYA TRISHA", "s": [2, 3, 6]}, "23761A05L7": {"n": "KANDULA TARUN", "s": [7, 10, 12]}, "23761A05L8": {"n": "KANURU UTTAM RAM", "s": [6, 8, 11]}, "23761A05L const main=document.getElementById('main'),tabs=document.getElementById('tabs'),who=document.getElementById('who');
let cur=null;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function block(code,label){
  const d=document.createElement('div');d.className='cb';
  d.innerHTML='<div class="cbh"><span>'+(label||'python')+'</span><button class="cp">Copy</button></div><pre>'+esc(code)+'</pre>';
  const b=d.querySelector('button');
  b.onclick=()=>{
    const done=()=>{b.textContent='Copied!';b.classList.add('ok');setTimeout(()=>{b.textContent='Copy';b.classList.remove('ok')},1500)};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(code).then(done,()=>fb())}else fb();
    function fb(){const t=document.createElement('textarea');t.value=code;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){b.textContent='Press Ctrl+C'}t.remove()}
  };
  return d;
}
function setCard(n){
  const s=D.sets[n],c=document.createElement('section');c.className='card';c.id='set'+n;
  c.innerHTML='<h2>Set '+n+' &ndash; '+esc(s.title)+'</h2>';
  s.items.forEach(it=>{
    const w=document.createElement('div');
    w.innerHTML='<h3>'+esc(it.label)+'</h3><p class="q">'+esc(it.text)+'</p>';
    it.code.forEach(x=>w.appendChild(block(x)));
    if(!it.code.length&&it.note)w.insertAdjacentHTML('beforeend','<p class="note">'+esc(it.note)+'</p>');
    c.appendChild(w);
  });
  return c;
}
function render(list){
  main.innerHTML='';
  main.appendChild((()=>{const d=document.createElement('div');d.className='card';
    d.innerHTML='<h2>Common setup (run once in Google Colab)</h2><p class="q">Needed for the sets that use ask_llm(). Sets 9, 10 and 11 have their own installs.</p>';
    d.appendChild(block(D.setup));return d})());
  list.forEach(n=>main.appendChild(setCard(n)));
}
function pick(n){cur=n;[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.n==n));render([n]);who.textContent='';window.scrollTo(0,0)}
Object.keys(D.sets).forEach(n=>{const b=document.createElement('button');b.className='tab';b.textContent='Set '+n;b.dataset.n=n;b.onclick=()=>pick(n);tabs.appendChild(b)});
function showAll(){cur=null;[...tabs.children].forEach(b=>b.classList.remove('on'));render(Object.keys(D.sets));who.textContent=''}
document.getElementById('clr').onclick=()=>{document.getElementById('roll').value='';showAll()};
document.getElementById('roll').oninput=e=>{
  const v=e.target.value.trim().toUpperCase();if(!v)return showAll();
  const k=Object.keys(D.students).find(x=>x===v||x.endsWith(v)&&v.length>=3);
  if(!k){who.textContent='No student found for "'+v+'"';return}
  const st=D.students[k];[...tabs.children].forEach(b=>b.classList.toggle('on',st.s.includes(+b.dataset.n)));
  who.textContent=k+' - '+st.n+' : Sets '+st.s.join(', ');render(st.s.map(String));
};
showAll();
